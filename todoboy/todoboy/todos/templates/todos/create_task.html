<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>

    {% load static %}

    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'task_list' %}">ToDoBoy</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'task_list' %}">To-Do List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'create_task' %}">Create Task</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Create New Task</h1>

        <div class="card p-4 shadow-sm">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="taskName">Task Name</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    {{ form.description }}
                </div>
                <div class="form-group">
                    <label for="taskStatus">Status</label>
                    {{ form.status }}
                </div>

                <button type="submit" class="btn btn-success mt-3">Create Task</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
